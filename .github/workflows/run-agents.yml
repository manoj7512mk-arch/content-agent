name: Run Content Agents

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  analyst:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Analyst agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/agents/analyst.js

      - name: Run Ideator agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/agents/ideator.js

      - name: Run Hook & Script agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/agents/hookscript.js

      - name: Run Planner agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/agents/planner.js

      - name: Commit results back to repo
        run: |
          git config user.name "content-agent-bot"
          git config user.email "actions@github.com"
          git add dashboard/agent-outputs/
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Update agent outputs"
          git push

      - name: Send Telegram report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/report.js
